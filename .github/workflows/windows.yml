name: Compilar Mesa para Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compilar solución
        run: dotnet build Mesa.sln -c Release --nologo
      - name: Verificar cálculos y reglas de impresión
        run: dotnet run --project tests/Mesa.Checks -c Release --no-build
      - name: Publicar aplicación con runtime incluido
        run: dotnet publish src/Mesa.Desktop -c Release -r win-x64 --self-contained true -o artifacts/Mesa --nologo
      - name: Incluir instrucciones
        shell: pwsh
        run: |
          Copy-Item README.md artifacts/Mesa/LEEME.md
          Get-ChildItem artifacts/Mesa -Filter *.pdb -Recurse | Remove-Item
      - name: Entregar aplicación de Windows
        uses: actions/upload-artifact@v4
        with:
          name: Mesa-Windows-x64
          path: artifacts/Mesa/
          if-no-files-found: error
          retention-days: 30
